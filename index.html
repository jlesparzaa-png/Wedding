<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boda D&JL</title>
<style>
  :root {
    --bg: #0f1a1c;
    --panel: #f4f7f6;
    --ink: #1e3538;
    --teal-900: #004d55;
    --teal-700: #005c66;
    --teal-500: #007a87;
    --teal-300: #00b1c4;
    --teal-100: #b3f4fa;
    --line: #d1dedc;
    --sidebar-w: 280px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* ---------- Menú lateral fijo ---------- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: linear-gradient(160deg, var(--teal-700) 0%, var(--teal-900) 100%);
    color: #fff;
    display: flex; flex-direction: column;
    z-index: 100;
    transition: transform .25s ease;
  }
  .brand {
    padding: 32px 24px 24px;
    border-bottom: 1px solid rgba(255,255,255,.15);
  }
  .brand h1 {
    margin: 0 0 6px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.5rem; font-weight: 600; letter-spacing: .5px;
  }
  .brand p { margin: 0; color: var(--teal-100); font-style: italic; font-size: .9rem; }

  .nav { list-style: none; margin: 0; padding: 16px 12px; flex: 1; overflow-y: auto; }
  .nav button {
    width: 100%; text-align: left;
    background: transparent; border: 0; color: #e6fbfd;
    padding: 14px 16px; margin-bottom: 4px;
    font: inherit; font-weight: 600; font-size: .95rem;
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    border-left: 3px solid transparent;
    transition: background .2s, border-color .2s;
  }
  .nav button .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,.14); font-size: .8rem; flex: none;
  }
  .nav button:hover { background: rgba(255,255,255,.1); }
  .nav button.active {
    background: rgba(255,255,255,.18);
    border-left-color: #00f2ff;
    color: #fff;
  }
  .nav button.active .num { background: #00f2ff; color: var(--teal-900); }
  .nav button:focus-visible { outline: 2px solid #00f2ff; outline-offset: 2px; }

  .side-foot {
    padding: 16px 24px; font-size: .8rem; color: var(--teal-100);
    border-top: 1px solid rgba(255,255,255,.15);
  }

  /* ---------- Barra superior móvil ---------- */
  .topbar {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    background: var(--teal-700); color: #fff;
    align-items: center; gap: 12px; padding: 0 16px; z-index: 90;
  }
  .topbar button {
    background: none; border: 0; color: #fff; cursor: pointer; padding: 8px;
  }
  .topbar svg { width: 24px; height: 24px; display: block; }
  .topbar span { font-weight: 600; }
  .scrim {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 95;
  }

  /* ---------- Pantalla principal ---------- */
  main {
    margin-left: var(--sidebar-w);
    min-height: 100vh;
    padding: 32px;
    display: flex; flex-direction: column;
  }
  .card {
    flex: 1;
    background: var(--panel);
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    padding: 36px 40px;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .card h2 {
    margin: 0 0 20px; padding-bottom: 12px;
    color: var(--teal-700);
    border-bottom: 2px solid #e0eceb;
    font-size: 1.6rem;
  }
  .card .lead { margin: 0 0 20px; line-height: 1.55; }

  .viewer { flex: 1; display: flex; justify-content: center; align-items: flex-start; min-height: 0; }
  .viewer img {
    max-width: 100%; max-height: calc(100vh - 220px);
    border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.15);
    object-fit: contain;
  }
  .viewer iframe {
    width: 100%; height: calc(100vh - 220px); min-height: 420px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .btn-link {
    display: inline-block; padding: 14px 28px;
    background: linear-gradient(135deg, var(--teal-700) 0%, var(--teal-500) 100%);
    color: #fff !important; text-decoration: none; font-weight: 700;
    border-radius: 25px; box-shadow: 0 4px 15px rgba(0,92,102,.3);
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  .btn-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,177,196,.5);
    background: linear-gradient(135deg, var(--teal-500) 0%, var(--teal-300) 100%);
  }
  .btn-link.alt {
    background: transparent; color: var(--teal-700) !important;
    border: 2px solid var(--teal-500); box-shadow: none;
  }

  /* ---------- Portada ---------- */
  .cover {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; color: #fff; border-radius: 10px; padding: 40px;
    background: linear-gradient(135deg, var(--teal-700) 0%, #008b99 100%);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .cover h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2rem, 4vw, 3.2rem); margin: 0 0 12px; font-weight: 600;
    border-bottom: 3px solid #00f2ff; padding-bottom: 16px; color: #fff;
  }
  .cover p { color: var(--teal-100); font-style: italic; font-size: 1.15rem; margin: 8px 0 0; }
  .cover small { margin-top: 36px; color: #80dfe8; opacity: .85; }

  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .topbar { display: flex; }
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: none; }
    .scrim.show { display: block; }
    main { margin-left: 0; padding: 72px 14px 14px; }
    .card { padding: 24px 20px; }
    .viewer img, .viewer iframe { max-height: none; height: auto; }
    .viewer iframe { height: 70vh; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button id="menuBtn" aria-label="Abrir menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <span>Boda D&amp;JL</span>
</header>
<div class="scrim" id="scrim"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <h1>Deon &amp; José Luis</h1>
    <p>Guía Digital y Recuerdos</p>
  </div>
  <ul class="nav" id="nav"></ul>
  <div class="side-foot">Gracias por acompañarnos</div>
</aside>

<main id="main"></main>

<script>
  /* ============================================================
     CONFIGURACIÓN DE SECCIONES
     tipo: "imagen" | "pdf" | "enlace"
     - imagen: src = ruta del archivo (jpg, png, etc.)
     - pdf:    src = ruta del PDF (se muestra incrustado)
     - enlace: src = URL externa; incrustar:true intenta mostrarla
               dentro de la pantalla (algunos sitios lo bloquean,
               por eso siempre hay botón para abrir en pestaña nueva)
     ============================================================ */
  const SECCIONES = [
    { id: "agradecimientos", titulo: "Agradecimientos",
      tipo: "imagen", src: "agradecimiento.jpg" },
    { id: "programa", titulo: "Programa de la Boda",
      tipo: "imagen", src: "programa.jpg" },
    { id: "mesas", titulo: "Mesas Asignadas",
      tipo: "imagen", src: "mesas.jpg" },
    { id: "convivencia", titulo: "Actividades de Convivencia",
      tipo: "imagen", src: "convivencia.jpg" },
    { id: "subir", titulo: "Fotos y Videos Preferidos (Subir)",
      tipo: "enlace", src: "https://jlesparzaa-png.github.io/FotosD-JL/", incrustar: false,
      texto: "Usa el siguiente botón para ir al espacio donde podrás enviarnos tus fotos y videos preferidos.",
      boton: "Ir a subir fotos y videos" },
    { id: "galeria", titulo: "Galería de Fotos y Videos Compartidos",
      tipo: "enlace", src: "https://drive.google.com/drive/folders/1U3qoCxvfuoRW-2KJ-eM1ySBp4-OahXQQ?usp=sharing", incrustar: false,
      texto: "Abre el álbum virtual con los momentos capturados por todos los invitados.",
      boton: "Ver galería compartida" }
  ];

  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400">' +
    '<rect width="100%" height="100%" fill="#e0eceb"/>' +
    '<text x="50%" y="50%" fill="#007a87" font-family="Segoe UI,Arial" font-size="20" ' +
    'text-anchor="middle" dominant-baseline="middle">Archivo no encontrado</text></svg>'
  );

  const nav = document.getElementById("nav");
  const main = document.getElementById("main");
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("scrim");

  /* Construir menú */
  SECCIONES.forEach((s, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.dataset.id = s.id;
    b.innerHTML = '<span class="num">' + (i + 1) + '</span><span>' + s.titulo + '</span>';
    b.addEventListener("click", () => mostrar(s.id));
    li.appendChild(b);
    nav.appendChild(li);
  });

  function esc(t) {
    const d = document.createElement("div"); d.textContent = t; return d.innerHTML;
  }

  function portada() {
    main.innerHTML =
      '<div class="cover fade">' +
        '<h2>Boda de Deon &amp; José Luis</h2>' +
        '<p>Guía Digital y Recuerdos</p>' +
        '<small>Selecciona una opción del menú para comenzar</small>' +
      '</div>';
  }

  function render(s) {
    let cuerpo = "";
    if (s.tipo === "imagen") {
      cuerpo = '<div class="viewer"><img src="' + esc(s.src) + '" alt="' + esc(s.titulo) + '"></div>';
    } else if (s.tipo === "pdf") {
      cuerpo = '<div class="viewer"><iframe src="' + esc(s.src) + '" title="' + esc(s.titulo) + '"></iframe></div>' +
               '<div class="actions"><a class="btn-link alt" href="' + esc(s.src) + '" target="_blank" rel="noopener">Abrir en pestaña nueva</a></div>';
    } else {
      cuerpo = '<p class="lead">' + esc(s.texto || "") + '</p>' +
               '<div class="actions"><a class="btn-link" href="' + esc(s.src) + '" target="_blank" rel="noopener">' + esc(s.boton || "Abrir enlace") + '</a></div>';
      if (s.incrustar) {
        cuerpo += '<div class="viewer" style="margin-top:20px"><iframe src="' + esc(s.src) + '" title="' + esc(s.titulo) + '"></iframe></div>';
      }
    }
    main.innerHTML = '<section class="card fade"><h2>' + esc(s.titulo) + '</h2>' + cuerpo + '</section>';

    const img = main.querySelector("img");
    if (img) img.addEventListener("error", () => { img.src = PLACEHOLDER; }, { once: true });
  }

  function mostrar(id) {
    const s = SECCIONES.find(x => x.id === id);
    if (!s) { portada(); marcar(null); return; }
    render(s);
    marcar(id);
    if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    cerrarMenu();
    window.scrollTo(0, 0);
  }

  function marcar(id) {
    nav.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  }

  /* Menú móvil */
  function abrirMenu() { sidebar.classList.add("open"); scrim.classList.add("show"); }
  function cerrarMenu() { sidebar.classList.remove("open"); scrim.classList.remove("show"); }
  document.getElementById("menuBtn").addEventListener("click", abrirMenu);
  scrim.addEventListener("click", cerrarMenu);

  /* Navegación con el hash de la URL (permite compartir enlaces directos) */
  window.addEventListener("hashchange", () => mostrar(location.hash.slice(1)));

  /* Inicio */
  const inicial = location.hash.slice(1);
  if (SECCIONES.some(s => s.id === inicial)) mostrar(inicial); else portada();
</script>
</body>
</html>
